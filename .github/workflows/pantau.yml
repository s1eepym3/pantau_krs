name: Pantau Kuota KRS Unimal

on:
  schedule:
    - cron: "*/30 * * * *"   # ketuk tiap 30 menit untuk menyiapkan penerus
  workflow_dispatch:

concurrency:
  group: pantau-kuota
  # Manual → batalkan run lama; Cron → jangan batalkan, antre sebagai penerus
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355      # 5 jam 55 menit — batas aman sebelum limit 6 jam GH Actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Jalankan monitoring kuota
        env:
          UNIMAL_NIM:         ${{ secrets.UNIMAL_NIM }}
          UNIMAL_PASSWORD:    ${{ secrets.UNIMAL_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u pantau_krs_cloud.py
